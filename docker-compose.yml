version: '3.8'
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 500M
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    environment:
      - POSTGRES_USER=eventadmin
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_DB=eventdb
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventadmin -d eventdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network
      
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-please_change_this_very_secure_random_string}
      - GIN_MODE=release
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=eventadmin
      - DB_PASSWORD=secure_password
      - DB_NAME=eventdb
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 300M
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/csrf-token"]
      interval: 30s 
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
