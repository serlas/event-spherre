# Основные настройки производительности
max_connections = 100
shared_buffers = '128MB'            # 1/4 доступной памяти для небольшого сервера
effective_cache_size = '384MB'      # 1/2 доступной памяти
work_mem = '16MB'                   # зависит от сложности запросов
maintenance_work_mem = '64MB'       # для операций обслуживания

# Настройки журналирования
wal_level = minimal
max_wal_senders = 0
wal_keep_size = 0
synchronous_commit = off            # для повышения производительности, но с небольшим риском
checkpoint_timeout = '5min'
checkpoint_completion_target = 0.9   # более плавная запись при проверке

# Оптимизация планировщика запросов
random_page_cost = 1.1              # для SSD дисков
effective_io_concurrency = 200      # для SSD
default_statistics_target = 100     # лучшая статистика для планировщика

# Настройки параллелизма
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8

# Различные настройки
autovacuum = on                     # автоматическая очистка
log_statement = 'ddl'               # логировать только DDL запросы
log_min_duration_statement = 1000   # логировать запросы дольше 1 секунды 